# Website of Eclipse CSI (csi.eclipse.dev): a strict Zensical build of docs/, with the list of projects regenerated
# from the GitHub API (scripts/generate_projects.py) and the news, blog posts, events and CVEs, from blogs.eclipse.org,
# the newsroom and the API of the Eclipse Foundation (scripts/generate_news.py), deployed to GitHub Pages.
#
# - build: only reads the repository, the public repositories of the organization, the OpenSSF Scorecard API, the PMI
#   (projects.eclipse.org), blogs.eclipse.org, the newsroom and api.eclipse.org, for the pull requests too.
# - deploy: the only job that may publish the site, from main, in the github-pages environment.
#
# The generated pages are not versioned: every run writes them from their sources. A source that cannot be read fails
# the build, the deployment is then skipped and GitHub Pages keeps serving the last site deployed.
#
# It runs on every change of main, every day (a new repository of the organization, a new post or event appears on the
# site, an archived repository or a past event leaves it, without a commit; GitHub suspends the schedule after 60 days
# without activity in the repository) and on demand.
#
# Setup, in the otterdog configuration of eclipse-csi (eclipse-csi/.eclipsefdn): GitHub Pages of this repository built
# by a workflow (gh_pages_build_type "workflow") and the environment github-pages limited to main.
name: site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

# Runs on main share the group "pages": one at a time, never cancelled (a deployment in progress always completes).
# A pull request gets its own group, a newer commit cancels the run of the previous one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # no cache: this workflow publishes what it builds. Wheels only, every file hash-checked: no setup script of a
      # package runs during the installation.
      - name: Install Zensical (requirements.txt, hash-checked wheels)
        run: |
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: --no-deps \
            -r requirements.txt
      - name: List the projects of the organization
        env:
          # only raises the rate limit of the API: the repositories listed are public
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/generate_projects.py
      - name: List the blog posts and the events
        run: python scripts/generate_news.py
      - name: Build the site (strict, broken links and anchors fail)
        run: zensical build --strict --clean
      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the only job that writes anything: the Pages deployment (pages) and the OIDC token proving its origin (id-token)
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
